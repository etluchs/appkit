name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Sync (dev deps)
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Test (fake backend + Graph contract tests, no network)
        env:
          APPKIT_BACKEND: fake
        run: uv run pytest

  conformance:
    # The same database suite as `test`, run a second time against a real
    # Postgres through the real psycopg pool. This is what catches
    # SQLite-vs-Postgres divergence before an app meets Azure Database for
    # PostgreSQL.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: appkit
          POSTGRES_PASSWORD: appkit
          POSTGRES_DB: appkit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U appkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Sync (dev deps)
        run: uv sync --extra dev

      - name: Database conformance (fake + real Postgres)
        env:
          APPKIT_TEST_PG_DSN: postgresql://appkit@localhost:5432/appkit
          APPKIT_TEST_PG_PASSWORD: appkit
        run: uv run pytest tests/test_db_conformance.py -v
