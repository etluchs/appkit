name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Sync (dev deps)
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Test (fake backend, no network)
        env:
          APPKIT_BACKEND: fake
        run: uv run pytest
