[project]
name = "appkit"
version = "0.1.0"
description = "UZH internal-app toolkit: SharePoint, mail, Postgres and Easy Auth over managed identity, with in-memory fakes for local dev."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "UZH" }]
dependencies = [
    # Azure-backed code paths. All are imported lazily, so the default `fake`
    # backend runs without contacting any of them, but they are declared here
    # so a production `uv sync` produces a ready-to-run image.
    "azure-identity>=1.16",
    "httpx>=0.27",
    # Reads SharePoint "Export to Excel" workbooks for the fake backend.
    "openpyxl>=3.1",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
]

[project.optional-dependencies]
# Cryptographic verification of the Easy Auth id token (APPKIT_AUTH=verify).
verify = [
    "pyjwt[crypto]>=2.8",
]
dev = [
    "pytest>=8",
    "pyjwt[crypto]>=2.8",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
# Self-check for a real deployment: `appkit-doctor` in the container, or as the
# command of a Container Apps Job.
appkit-doctor = "appkit.doctor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appkit"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live and soak tests are opt-in: `pytest` must stay offline and fast. A later
# -m on the command line replaces this, so `pytest -m live` selects them.
addopts = "-q -m 'not live and not soak'"
markers = [
    "live: talks to real Microsoft Graph / Azure Postgres (needs APPKIT_BACKEND=azure)",
    "soak: runs for over an hour to outlive an Entra token",
]
